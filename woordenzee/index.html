<style>
/* Layout: zeekaart als raster van eilandtegels; rustige witte oefenkaart tijdens spelling. Eén vaste, felle gamewereld (geen donker thema). */
:root{
  --sea:#0b3a6b; --sea2:#1565a8; --foam:#bfe9ff;
  --ink:#16203f; --paper:#fffaf0; --card:#ffffff;
  --sun:#ffc62e; --coral:#ff5d4d; --leaf:#22b573; --sky:#39b8ff; --plum:#7a4be0;
  --soft:#e8eefb; --mute:#5a6788; --warm:#fff1c9;
  --font:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --r:18px; --line:3px solid var(--ink); --drop:0 5px 0 var(--ink);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.4;overflow-x:hidden;

[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
#app{max-width:1180px;margin:0 auto;padding-block:12px 110px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(12px,env(safe-area-inset-top,0px))}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.5rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
.col{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.center{text-align:center;align-items:center}
.mut{color:var(--mute);font-size:.92rem}
.light{color:#fff}
.btn{border:var(--line);border-radius:16px;background:var(--card);padding:12px 18px;font-weight:800;min-height:52px;box-shadow:var(--drop);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.sun{background:var(--sun)} .btn.leaf{background:var(--leaf);color:#fff} .btn.sky{background:var(--sky)} .btn.coral{background:var(--coral);color:#fff}
.btn.big{font-size:1.25rem;min-height:64px;padding:14px 26px}
.btn.sm{min-height:44px;padding:8px 12px;font-size:.92rem;box-shadow:0 3px 0 var(--ink);border-radius:12px}
.btn.ghost{background:transparent;color:#fff;border-color:#fff;box-shadow:none}
.btn[disabled]{opacity:.5;cursor:default}
.card{background:var(--card);border:var(--line);border-radius:var(--r);box-shadow:var(--drop);padding:16px}
.card.paper{background:var(--paper)}
.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:3px 10px;font-weight:800;font-size:.85rem;background:#fff;white-space:nowrap}
.pill.ok{background:#c9f5dd} .pill.help{background:#ffe2a8} .pill.new{background:var(--soft)}
input[type=text],input[type=search],input[type=password],textarea,select{border:var(--line);border-radius:14px;padding:12px 14px;background:#fff;width:100%;font-size:1.05rem;min-height:52px}
textarea{min-height:90px;resize:vertical}
label{font-weight:800;font-size:.92rem;display:flex;flex-direction:column;gap:5px}

/* kop + navigatie */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.logo{color:#fff;font-weight:900;font-size:1.35rem;letter-spacing:.5px;text-shadow:0 3px 0 var(--ink);display:flex;align-items:center;gap:8px}
.logo small{display:block;font-size:.62rem;letter-spacing:2.5px;color:var(--sun);text-shadow:0 2px 0 var(--ink)}
.nav{display:flex;gap:8px}
.nav button{border:var(--line);background:#fff;border-radius:14px;padding:8px 12px;font-weight:800;min-height:50px;display:flex;flex-direction:column;align-items:center;font-size:.78rem;line-height:1.1;min-width:70px;box-shadow:0 3px 0 var(--ink)}
.nav button span{font-size:1.35rem}
.nav button.on{background:var(--sun)}
@media (max-width:759px){
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);justify-content:space-around;gap:6px;
    padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
  .nav button{flex:1;min-width:0;box-shadow:none}

@media (min-width:760px){ #app{padding-bottom:40px} .top .nav{margin-left:auto} }

/* kaart */
.world{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:980px){ .world{grid-template-columns:minmax(0,1fr) 320px;align-items:start} }
.isles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:620px){ .isles{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px} }

.isle svg{width:100%;height:auto;display:block}
.isle b{font-size:1.02rem;line-height:1.1}
.isle .mut{font-size:.78rem;color:var(--ink)}
.isle.locked{background:linear-gradient(#b9c3d6,#8894ad)}
.isle.locked svg{filter:grayscale(1) brightness(.8)}
.isle .lock{position:absolute;top:26%;left:50%;transform:translate(-50%,-50%);font-size:2.6rem}
.isle .here{position:absolute;top:6px;right:8px;font-size:1.7rem;animation:bob 2.4s ease-in-out infinite}
.isle .num{position:absolute;top:8px;left:8px;background:var(--ink);color:#fff;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-weight:900;font-size:.9rem}
@keyframes bob{50%{transform:translateY(-5px) rotate(-4deg)}}
.bar{height:14px;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;width:100%}
.bar i{display:block;height:100%;background:var(--leaf)}
.cap{display:flex;gap:12px;align-items:center}
.cap svg{width:76px;height:76px;flex:none}
.stat{display:flex;gap:8px;flex-wrap:wrap}

/* missies */
.mis{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.mis .ic{width:52px;height:52px;border-radius:50%;border:var(--line);display:grid;place-items:center;font-size:1.5rem;background:var(--sun);flex:none}
.banner{border:var(--line);border-radius:22px;padding:14px;color:#fff;box-shadow:var(--drop);display:flex;gap:14px;align-items:center}
.banner svg{width:130px;flex:none}
.banner h2{text-shadow:0 2px 0 var(--ink)}

/* oefenen: rustig */
.play{max-width:560px;margin:0 auto}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #fff;background:transparent}
.dots i.d{background:var(--sun)} .dots i.c{background:#fff}
.listen{width:120px;height:120px;border-radius:50%;font-size:3rem;background:var(--sky);border:var(--line);box-shadow:var(--drop)}
.listen:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.answer{font-size:1.6rem!important;text-align:center;font-weight:800;letter-spacing:1px;min-height:64px!important}
.slots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.slots i{font-style:normal;width:34px;height:42px;border:2px solid var(--ink);border-radius:9px;display:grid;place-items:center;font-weight:900;font-size:1.3rem;background:#fff}
.slots i.g{background:#c9f5dd} .slots i.sp{border-color:transparent;background:transparent;width:14px}
.hint{background:var(--warm);border:2px dashed var(--ink);border-radius:14px;padding:12px}
.fullword{font-size:2rem;font-weight:900;letter-spacing:2px;text-align:center;word-break:break-word}
.good{background:#dff9ea;border:var(--line);border-radius:14px;padding:14px}
.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.8);opacity:.3}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* bibliotheek, crew, ouders */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.wcard{padding:12px;display:flex;flex-direction:column;gap:6px}
.wcard .w{font-size:1.3rem;font-weight:900;word-break:break-word}
.crewg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.crewc{text-align:center;padding:10px}
.crewc svg{width:96px;height:96px}
.crewc.off svg{filter:brightness(0) opacity(.25)}
.treg{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.tre{border:var(--line);border-radius:14px;background:#fff;text-align:center;padding:8px 4px;font-size:.74rem;font-weight:800;line-height:1.15}
.tre span{display:block;font-size:2rem}
.tre.off{background:var(--soft);color:var(--mute)} .tre.off span{filter:grayscale(1) opacity(.3)}
.parent{background:#f3f5fa;border-radius:var(--r);border:var(--line);padding:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:2px solid var(--ink);background:#fff;border-radius:10px;padding:8px 12px;font-weight:800;min-height:44px}
.tabs button.on{background:var(--ink);color:#fff}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid #cfd6e6;vertical-align:middle}
td.n{font-variant-numeric:tabular-nums;text-align:right} th.n{text-align:right}
.note{background:#fff7d6;border:2px solid var(--ink);border-radius:12px;padding:10px 12px;font-size:.92rem}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:800;z-index:50;max-width:90vw;text-align:center}
</style>
</head>

const KEY='woordenzee.v1';
let S=null, AUD={}, db=null, storageOk=true;
function fresh(){
  const words=[];let n=0;
  WORDS.forEach((list,isl)=>list.forEach(x=>words.push({id:'b'+(n++),w:x[0],m:x[1],z:x[2],isl})));
  return {v:1,name:'',coins:0,words,prog:{},done:{},tre:[],crew:[],next:1000,
    set:{slow:false,voice:'',peek:false,openAll:false,sfx:true,pin:''}};
}
function load(){
  try{const t=localStorage.getItem(KEY);if(t){const o=JSON.parse(t);if(o&&Array.isArray(o.words)){S=Object.assign(fresh(),o);S.set=Object.assign(fresh().set,o.set||{});return}}}
  catch(e){storageOk=false}
  S=fresh();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOk=true}catch(e){storageOk=false}}
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('woordenzee',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('audio');
  r.onsuccess=()=>{db=r.result;try{const q=db.transaction('audio').objectStore('audio').openCursor();
    q.onsuccess=()=>{const c=q.result;if(c){AUD[c.key]=c.value;c.continue()}else res(true)};q.onerror=()=>res(false)}catch(e){res(false)}};

  if(G.key){const [i,k]=G.key;out.isl=i;const d=S.done[i]||(S.done[i]=[]);
    if(!d.includes(k)){d.push(k);S.coins+=5;out.coins+=5;
      const free=TRE.map((_,x)=>x).filter(x=>!S.tre.includes(x));if(free.length){S.tre.push(free[0]);out.tre=free[0]}}
    if(complete(i)&&!S.crew.includes(i)){S.crew.push(i);out.crew=i}}
  save();G=null;V={s:'end',out};
}

function exportData(){return JSON.stringify({app:'woordenzee',v:1,exported:new Date().toISOString(),state:S,audio:AUD})}
function importData(txt){
  let o;try{o=JSON.parse(txt)}catch(e){toast('Dit is geen geldige back-up.');return false}
  if(!o||o.app!=='woordenzee'||!o.state||!Array.isArray(o.state.words)){toast('Dit is geen Woordenzee-back-up.');return false}
  Object.keys(AUD).forEach(k=>audSet(k,null));
  S=Object.assign(fresh(),o.state);S.set=Object.assign(fresh().set,o.state.set||{});
  S.words=S.words.filter(w=>w&&w.id&&w.w).map(w=>({id:String(w.id),w:String(w.w),m:String(w.m||''),z:String(w.z||''),isl:Math.min(5,Math.max(0,w.isl|0))}));
  Object.entries(o.audio||{}).forEach(([k,v])=>{if(typeof v==='string'&&v.startsWith('data:audio'))audSet(k,v)});
  save();impText='';toast('Back-up geïmporteerd ✔');return true;
}

const A={
  go(el){const v=el.dataset.v;if(v==='gate')gate=null;if(v==='isle')go('isle',{i:+el.dataset.i});else go(v)},
  start(){const n=$('#capname').value.trim();if(!n){$('#capname').focus();toast('Typ eerst je naam.');return}

  review(){const r=review().slice(0,6).map(w=>w.id);if(r.length)startGame(r,null)},
  listen(){playWord(wordById(G.q[G.i]),S.set.slow);const i=$('#answer');if(i&&!i.disabled)i.focus()},
  slow(){playWord(wordById(G.q[G.i]),true);const i=$('#answer');if(i&&!i.disabled)i.focus()},

  nosound(){S.set.peek=true;save();G.focus=false;draw();toast('Tik op 👀 Kijk om het woord te zien.')},
  peek(){G.phase='peek';G.focus=false;draw()},
  cover(){G.phase='ask';G.focus=true;draw()},
  reshow(){G.phase='shown';G.focus=false;draw()},
  hinttoggle(){G.hide=!G.hide;G.focus=true;draw()},
  skip(){const w=wordById(G.q[G.i]);G.res[w.id]='help';G.i++;if(G.i>=G.q.length){finish();draw();return}newWord();G.focus=true;draw();playWord(wordById(G.q[G.i]),S.set.slow)},
  next(){nextWord();if(V.s==='end')draw()},
  quit(){const k=G&&G.key;G=null;try{speechSynthesis.cancel()}catch(e){}k?go('isle',{i:k[0]}):go('map')},
  libsay(el){const w=wordById(el.dataset.v);if(!canHear(w))toast('Geen geluid op dit toestel.');else playWord(w,S.set.slow)},
  libopen(el){LO=el.dataset.v||null;$('#libout').innerHTML=libCards()},
  libzin(el){const id=el.dataset.v;P(id).zin=$('#lz-'+id).value.trim();save();toast('Zin bewaard ✔');LO=null;$('#libout').innerHTML=libCards()},
  libf(el){LF=el.dataset.v;draw()},
  leaveparent(){PE=null;confirmKey='';expText='';go('map')},
  ptab(el){PT=el.dataset.v;PE=null;confirmKey='';draw()},
  pedit(el){PE=el.dataset.v||null;confirmKey='';draw()},
  pplay(el){playWord(wordById(el.dataset.v),false)},
  auddel(el){audSet(el.dataset.v,null);draw()},
  async rec(el){const id=el.dataset.v;
    if(rec){rec.stop();return}
    try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const parts=[];const mr=new MediaRecorder(stream);
      mr.ondataavailable=e=>parts.push(e.data);
      mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop());rec=null;const b=new Blob(parts,{type:mr.mimeType||'audio/webm'});const r=new FileReader();
        r.onload=()=>{audSet(id,String(r.result));toast('Opname bewaard ✔');draw()};r.readAsDataURL(b)};
      rec=mr;mr.start();draw()}catch(e){rec=null;toast('Opnemen lukt niet. Kies een audiobestand.');draw()}},

    if(k==='import'){importData(impText)}
    if(k==='resetprog'){S.prog={};S.done={};S.tre=[];S.crew=[];S.coins=0;save();toast('Voortgang gewist')}
    if(k==='resetall'){Object.keys(AUD).forEach(x=>audSet(x,null));const n=S.name;S=fresh();S.name=n;save();toast('Alles gewist')}
    draw()},
  expfile(){try{const b=new Blob([exportData()],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=fileName();document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
    toast('Back-up gedownload. Niets gezien? Gebruik "Toon als tekst".')}catch(e){A.exptext()}},
  async expshare(){try{const f=new File([exportData()],fileName(),{type:'application/json'});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Woordenzee back-up'});return}}catch(e){if(e&&e.name==='AbortError')return}A.exptext()},
  exptext(){expText=exportData();draw()},
  async expcopy(){const t=$('#exptxt');try{await navigator.clipboard.writeText(t.value);toast('Gekopieerd ✔')}catch(e){t.focus();t.select();toast('Tekst geselecteerd. Kies nu Kopieer.')}},
  voicetest(){S.set.voice=($('#svoice')||{}).value||'';if(!say('Ahoy kapitein! Schrijf het woord schat.',$('#sslow').checked))toast('Deze browser kan niet voorlezen.')},
  setsave(){S.name=$('#sname').value.trim()||S.name;S.set.voice=($('#svoice')||{}).value||'';S.set.slow=$('#sslow').checked;S.set.peek=$('#speek').checked;
    S.set.openAll=$('#sopen').checked;S.set.sfx=$('#ssfx').checked;S.set.pin=$('#spin').value.trim();save();toast('Instellingen bewaard ✔');draw()}
};
const F={
  check(){check()},
  gate(){const v=$('#gatein').value.trim();if(S.set.pin?v===S.set.pin:+v===gate.a*gate.b){gate=null;PT='woorden';go('parent')}else{toast('Dat klopt niet.');$('#gatein').value=''}},
  wsave(){const w=$('#ew').value.trim().replace(/\s+/g,' ');if(!w)return;
    if(S.words.some(x=>x.id!==PE&&norm(x.w)===norm(w))){toast('Dit woord staat al in de lijst.');return}
    const d={w,m:$('#em').value.trim(),z:$('#ez').value.trim(),isl:+$('#ei').value};
    if(PE==='new'){const id='c'+(S.next++);S.words.push(Object.assign({id},d));PE=id;toast('Bewaard. U kunt nu audio koppelen.')}
    else{Object.assign(wordById(PE),d);PE=null;toast('Bewaard ✔')}
    save();draw()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f){if(el.dataset.a!=='confirm'&&confirmKey){confirmKey=''}f(el,e)}});
document.addEventListener('submit',e=>{const f=e.target.dataset&&F[e.target.dataset.f];if(f){e.preventDefault();f()}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='libq'){LQ=t.value;$('#libout').innerHTML=libCards()}
  if(t.id==='pq'){PQ=t.value;const q=norm(PQ);$('#pwout').innerHTML=pWordRows(S.words.filter(w=>!q||norm(w.w).includes(q)))}
  if(t.id==='imptxt'){impText=t.value}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='eaud'&&PE)readAudioFile(t.files[0],PE);
  if(t.id==='impfile'&&t.files[0]){const r=new FileReader();r.onload=()=>{impText=String(r.result);confirmKey='import';draw();toast('Bestand geladen. Tik op de rode knop om te importeren.')};r.readAsText(t.files[0])}});
/* ================= START ================= */
load();draw();
idbOpen().then(()=>{if(V.s==='parent')draw()});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
